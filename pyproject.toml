[project]
name = "edge-platform"
version = "0.2.0"
description = "EDGE's shared platform package. First tenant: the ntfy.sh push budget -- one policy file, its reader, the declared sender registry, and the Alertmanager night-window check."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
edge-notify = "edge_platform.notify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_platform"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.15"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF002", "RUF022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
