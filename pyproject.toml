[project]
name = "edge-platform"
version = "0.8.0"
description = "EDGE's shared platform package: the ntfy.sh push budget (notify), the trading-hours deploy fence (fence), the compose-rules .env reader (env), the duplicate-guarded spec registry (registry), the FastAPI service kit (service) and shipped Windmill step templates (windmill)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[project.scripts]
edge-notify = "edge_platform.notify.cli:main"
edge-fence = "edge_platform.fence.cli:main"
edge-env = "edge_platform.env.cli:main"

[project.optional-dependencies]
db = [
    "psycopg[binary]>=3.2",
]
# edge_platform.service: the composition root trade-data and trade-quant share (db core, lifespan,
# settings base, /admin/run/* timeline middleware). Importing edge_platform alone never needs these.
service = [
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_platform"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
    "edge-platform[service]",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF002", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# Windmill infers a step's schema from main()'s signature; the shipped templates keep the
# `param: dict = None` form every estate Windmill script uses (RUF013 would rewrite it).
"edge_platform/windmill/templates/*.py" = ["RUF013"]

[tool.pytest.ini_options]
testpaths = ["tests"]
