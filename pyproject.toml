[project]
name = "edge-platform"
version = "0.3.3"
description = "EDGE's shared platform package: the ntfy.sh push budget (notify) and the trading-hours deploy fence (fence)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[project.scripts]
edge-notify = "edge_platform.notify.cli:main"
edge-fence = "edge_platform.fence.cli:main"

[project.optional-dependencies]
db = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_platform"]

[dependency-groups]
dev = [
    "exchange-calendars>=4.13.2",
    "pytest>=8.3",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF002", "RUF022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
