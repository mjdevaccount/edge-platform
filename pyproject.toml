[project]
name = "edge-platform"
version = "0.14.0"
description = "EDGE's shared platform package, the estate half: the trading-hours deploy fence (fence), the compose-rules .env reader (env), the ntfy.sh push budget policy (notify), ingest lanes (lanes) and shipped Windmill step templates (windmill). The general planes (registry, stamp, sqlkit, budget, plugins, config, service, watch, the push pipeline) are platform-kit's, imported here under their old names."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# platform-kit and primitives-kit are on no index: a PEP 508 direct reference (a public git tag) is
# the pin, so pip and uv both fetch the same commit and no index can answer for the name.
dependencies = [
    "platform-kit @ git+https://github.com/mjdevaccount/groundwork@platform-kit-v0.2.0#subdirectory=packages/platform-kit",
    "pyyaml>=6.0",
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[project.scripts]
edge-notify = "edge_platform.notify.cli:main"
edge-fence = "edge_platform.fence.cli:main"
edge-env = "edge_platform.env.cli:main"

[project.optional-dependencies]
db = [
    "psycopg[binary]>=3.2",
]
# The general extras are platform-kit's (since v0.13.0), named the same here so a consumer's
# `edge-platform[service]` keeps working. service: edge_platform.service (and config, whose
# pydantic-settings it carries).
service = [
    "platform-kit[service] @ git+https://github.com/mjdevaccount/groundwork@platform-kit-v0.2.0#subdirectory=packages/platform-kit",
]
# edge_platform.config alone: typed knobs (pydantic-settings), without the FastAPI chassis.
config = [
    "platform-kit[config] @ git+https://github.com/mjdevaccount/groundwork@platform-kit-v0.2.0#subdirectory=packages/platform-kit",
]
# The async-SQL stores: edge_platform.watch.state, edge_platform.notify.ledger and
# edge_platform.budget. platform-kit's [sql] brings primitives-kit (the budget error tree) itself: from
# platform-kit 0.1.1 its wheel names it by a direct reference to its release tag, so pip never asks an
# index, and uv resolves it from groundwork's workspace at the platform-kit commit. Not pinned here
# (v0.13.0 pinned it at the platform-kit tag, a second URL beside 0.1.1's).
sql = [
    "platform-kit[sql] @ git+https://github.com/mjdevaccount/groundwork@platform-kit-v0.2.0#subdirectory=packages/platform-kit",
]
# edge_platform.plugins and edge_platform.testing.plugin_conformance (needs pytest).
plugins = [
    "platform-kit[plugins] @ git+https://github.com/mjdevaccount/groundwork@platform-kit-v0.2.0#subdirectory=packages/platform-kit",
]
# The pack loader (platform_kit.packs, since platform-kit 0.2.0): import it from platform_kit
# directly -- it is new, so it has no old edge_platform name to alias.
packs = [
    "platform-kit[packs] @ git+https://github.com/mjdevaccount/groundwork@platform-kit-v0.2.0#subdirectory=packages/platform-kit",
]
# edge_platform.lanes: dlt land/promote + the no-TRUNCATE postgres destination. The LaneSpec core,
# source gate and freshness verdict are stdlib and import without it.
dlt = [
    "dlt[postgres]>=1.27.2",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the platform-kit / primitives-kit pins above are direct references (no index carries them)
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["edge_platform"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
    "asyncpg>=0.30",
    "edge-platform[config,dlt,plugins,service,sql]",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.15",
    "testcontainers[postgres]>=4.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF002", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# Windmill infers a step's schema from main()'s signature; the shipped templates keep the
# `param: dict = None` form every estate Windmill script uses (RUF013 would rewrite it).
"edge_platform/windmill/templates/*.py" = ["RUF013"]

[tool.pytest.ini_options]
testpaths = ["tests"]
