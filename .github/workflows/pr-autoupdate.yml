# pr-autoupdate -- merge main into the NEXT armed PR in line (a serial queue, below), on every push
# to main and whenever the ci workflow finishes. The owner's shared caller shape over ci-kit's
# reusable pr-autoupdate.yml; ci-kit declares the secrets by its own names,
# so they are MAPPED below -- `secrets: inherit` only works when the caller's names match.
# Added 2026-11-28: edge-platform#32 sat BEHIND under strict protection with nothing updating it.
#
# It is what makes "require branches to be up to date" (strict protection) affordable: strict with
# nothing updating branches stalls every armed PR BEHIND. A conflicting PR gets label `conflict`
# and one ntfy page if NTFY_URL is set.
#
# THE APP ACTS, NO PAT (2026-11-23): the edge-bot App (variable EDGE_BOT_APP_ID, secret
# EDGE_BOT_PRIVATE_KEY) mints the push token, and the repo variable PR_TOKEN_SOURCE=app-required
# means the PAT is never read -- this repo has none. An App that cannot mint is a RED run, named.
# GITHUB_TOKEN is not a fallback: a push made with it fires no workflow, so every updated PR
# would wait on checks that never start.
name: pr-autoupdate

on:
  push:
    branches: [main]
  # A PR held because its checks were running (an update would cancel them) or because the queue
  # was full is reconsidered when the check workflow finishes. Without this a held PR waits for the
  # next push to main.
  workflow_run: # zizmor: ignore[dangerous-triggers] -- reads no PR code; the job guard below
    workflows: [ci]
    types: [completed]
  # ARMING STARTS A PASS (ci-kit v1.32.0): enabling auto-merge is neither a push nor a CI run, so a
  # newly armed PR waited for the next one (three PRs in sibling repos sat until a hand
  # dispatch, 2026-11-14). pull_request_target runs THIS file from the base branch with its
  # secrets, and the reusable checks out no PR code; the job guard below refuses a fork's PR.
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- base-branch file, no PR checkout, forks refused
    types: [auto_merge_enabled]
  workflow_dispatch:

# pull-requests/checks/statuses read: ci-kit reads the open-PR list (with check results)
# with GITHUB_TOKEN -- GitHub refuses a fine-grained PAT the check runs (2026-10-24)
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  # one updater at a time, queued, never cancelled
  group: pr-autoupdate
  cancel-in-progress: false

jobs:
  update:
    # A skipped job takes no runner: main's own CI finishing (the push trigger already ran for that
    # sha) and a cancelled (superseded) PR run can change nothing in the queue.
    if: >-
      (github.event_name != 'workflow_run' && github.event_name != 'pull_request_target')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.conclusion != 'cancelled')
      || (github.event_name == 'pull_request_target'
          && github.event.pull_request.head.repo.full_name == github.repository)
    uses: mjdevaccount/ci-kit/.github/workflows/pr-autoupdate.yml@v1
    with:
      # SERIAL QUEUE (owner, 2026-11-14: one PR at a time per repo; a sibling repo's shape since
      # 2026-10-24): one armed PR tested against current main at a time, lowest PR number first; a
      # PR whose own required checks are red or running is held. Updating every armed PR on every
      # push re-ran CI on all of them for one merge -- under strict only ONE PR merges per main sha.
      # Policy: ci-kit ci_kit/pr_queue.py. `0` restores update-everything.
      max-in-flight: 1
      # the App by its generic names (ci-kit README "Generic names", v1.42.0)
      app-client-id: ${{ vars.EDGE_BOT_APP_ID }}
      # EXACTLY the branch-protection required contexts (gh api .../branches/main/protection
      # -q .required_status_checks.contexts), matched by name against the PR's statusCheckRollup.
      # A context added to protection but not here is ignored by the queue: keep them in step.
      required-checks: "test,gitleaks (secret scan) / scan,dup-code / lint"
    secrets:
      app-private-key: ${{ secrets.EDGE_BOT_PRIVATE_KEY }}
      ntfy-url: ${{ secrets.NTFY_URL }}
