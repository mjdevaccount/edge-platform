# edge-platform's own gate: ruff (lint + format) and the tests against the locked deps, the
# packaged CLI run the way consumers run it, and gitleaks over history through ci-kit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # v0.10.0: the SQL stores (watch.state, notify.ledger) run against a REAL Postgres -- a faked store
    # proves the caller, never the statement. REQUIRED=1 turns the local "no DSN -> skip" into a FAIL.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: tests
        env:
          EDGE_PLATFORM_TEST_PG: postgresql://postgres:test@localhost:5432/postgres
          EDGE_PLATFORM_TEST_PG_REQUIRED: "1"
        run: uv run pytest -q
      - name: the .env twins against docker compose itself (tests/env/lib-env.test.sh)
        # The oracle: both twins over one fixture, LF and CRLF, against answers compose produced, and
        # compose RE-ASKED here (ubuntu-latest has it; CI=true makes a missing compose exit 2, never a
        # skip). This is the one place it runs: consumers prove their vendored copies equal to the
        # release with `edge-env check-copy` instead of each re-running it.
        run: bash tests/env/lib-env.test.sh
      - name: the built wheel carries its data files and its CLI works
        run: |
          uv build
          uvx --from dist/edge_platform-*.whl edge-notify check-pin
          # v0.6.0: the sender registry and the fence policy are the CONSUMER's; the wheel carries
          # neither, so the CLI is run against the test fixtures -- and must refuse (2) with none.
          uvx --from dist/edge_platform-*.whl edge-notify senders --registry tests/fixtures/ntfy-publishers.json
          uvx --from dist/edge_platform-*.whl edge-fence status
          uvx --from dist/edge_platform-*.whl edge-fence --policy tests/fence/fixtures/fence-policy.json check --tier service --at 2025-11-29T12:00
          set +e; env -u EDGE_FENCE_POLICY uvx --from dist/edge_platform-*.whl edge-fence check --tier service --at 2025-11-29T12:00; rc=$?; set -e
          [ "$rc" = 2 ] || { echo "::error::edge-fence with no policy gave rc=$rc (want 2)"; exit 1; }
          ! unzip -l dist/edge_platform-*.whl | grep -E 'fence-policy|ntfy-publishers' || { echo "::error::the wheel ships estate config"; exit 1; }
          uvx --from dist/edge_platform-*.whl edge-env check-copy edge_platform/env/lib-env.sh edge_platform/env/lib_env.py
          sh=$(uvx --from dist/edge_platform-*.whl edge-env path sh) && bash -n "$sh"
          # the [service] extra resolves from the wheel's own metadata and every tenant module imports
          whl=$(ls dist/edge_platform-*.whl)
          uv run --isolated --no-project --with "${whl}[service]" python -c "import edge_platform.registry, edge_platform.service.db, edge_platform.service.lifespan, edge_platform.service.settings, edge_platform.service.timeline, edge_platform.service.flags, edge_platform.service.envelope, edge_platform.service.http_errors, edge_platform.service.auth, edge_platform.service.health, edge_platform.service.pg_identity, edge_platform.service.admin_run"
          # the registry is stdlib: importable from the BASE wheel, no extra
          uv run --isolated --no-project --with "${whl}" python -c "import edge_platform.registry"
          # v0.9.0: the lane core (spec, gate, freshness) is stdlib -- BASE wheel; land + destination need [dlt]
          uv run --isolated --no-project --with "${whl}" python -c "import edge_platform.lanes.spec, edge_platform.lanes.gate, edge_platform.lanes.freshness"
          uv run --isolated --no-project --with "${whl}[dlt]" python -c "from edge_platform.lanes.destination import nolock_postgres; from edge_platform.lanes.land import land_and_promote; assert nolock_postgres()._raw_capabilities().supports_truncate_command is False"
          # v0.10.0: the watchdog plane, the notify pipeline, stamp and sqlkit are stdlib -- BASE wheel (no
          # sqlalchemy there, so this also proves the runner never imports it); the two SQL stores need [sql]
          uv run --isolated --no-project --with "${whl}" python -c "import edge_platform.watch.spec, edge_platform.watch.runner, edge_platform.watch.pager, edge_platform.notify.pipeline, edge_platform.notify.types, edge_platform.notify.local, edge_platform.stamp, edge_platform.sqlkit"
          uv run --isolated --no-project --with "${whl}[sql]" python -c "import edge_platform.watch.state, edge_platform.notify.ledger"
          # v0.8.0: the Windmill templates ship IN the wheel and copy out of it (base wheel, no extra)
          tmp=$(mktemp -d)
          uv run --isolated --no-project --with "${whl}" python -m edge_platform.windmill copy post_admin_run "$tmp" u/admin/post_admin_run
          test -s "$tmp/u/admin/post_admin_run.py" && test -s "$tmp/u/admin/post_admin_run.script.lock"
          grep -q '!inline u/admin/post_admin_run.script.lock' "$tmp/u/admin/post_admin_run.script.yaml"
          uv run --isolated --no-project --with "${whl}" python -m edge_platform.windmill copy post_admin_run "$tmp" u/admin/post_admin_run --check

  gitleaks:
    name: gitleaks (secret scan)
    permissions:
      contents: read
      pull-requests: read
    uses: mjdevaccount/ci-kit/.github/workflows/gitleaks.yml@v1
    with:
      mode: history

  # The same code written twice fails the PR: ci-kit's `ci-dup-code` (jscpd 5.4.2 behind a
  # shrink-only fingerprint baseline, ci/jscpd-baseline.json -- 0 clone(s) frozen 2026-10-31, the
  # backlog of "written again"). A NEW clone >= 70 tokens / 7 lines between two tracked files
  # fails; a removed one may re-freeze smaller (`--write-baseline` refuses to grow). Reports as
  # "dup-code / lint".
  dup-code:
    uses: mjdevaccount/ci-kit/.github/workflows/dup-code.yml@v1
