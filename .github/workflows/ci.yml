# edge-platform's own gate: ruff (lint + format) and the tests against the locked deps, the
# packaged CLI run the way consumers run it, and gitleaks over history through ci-kit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: tests
        run: uv run pytest -q
      - name: the .env twins against docker compose itself (tests/env/lib-env.test.sh)
        # The oracle: both twins over one fixture, LF and CRLF, against answers compose produced, and
        # compose RE-ASKED here (ubuntu-latest has it; CI=true makes a missing compose exit 2, never a
        # skip). This is the one place it runs: consumers prove their vendored copies equal to the
        # release with `edge-env check-copy` instead of each re-running it.
        run: bash tests/env/lib-env.test.sh
      - name: the built wheel carries its data files and its CLI works
        run: |
          uv build
          uvx --from dist/edge_platform-*.whl edge-notify check-pin
          uvx --from dist/edge_platform-*.whl edge-notify senders
          uvx --from dist/edge_platform-*.whl edge-fence status
          uvx --from dist/edge_platform-*.whl edge-fence check --tier service --at 2025-11-29T12:00
          uvx --from dist/edge_platform-*.whl edge-env check-copy edge_platform/env/lib-env.sh edge_platform/env/lib_env.py
          sh=$(uvx --from dist/edge_platform-*.whl edge-env path sh) && bash -n "$sh"
          # the [service] extra resolves from the wheel's own metadata and every tenant module imports
          whl=$(ls dist/edge_platform-*.whl)
          uv run --isolated --no-project --with "${whl}[service]" python -c "import edge_platform.service.db, edge_platform.service.lifespan, edge_platform.service.settings, edge_platform.service.timeline"

  gitleaks:
    name: gitleaks (secret scan)
    permissions:
      contents: read
      pull-requests: read
    uses: mjdevaccount/ci-kit/.github/workflows/gitleaks.yml@v1
    with:
      mode: history
